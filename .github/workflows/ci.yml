name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # go-hid needs cgo; macOS has the toolchain and IOKit, Linux would need libudev headers.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
